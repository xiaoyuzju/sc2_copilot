[workspace]
members = [
    "crates/sc2-copilot-app",
    "crates/sc2-copilot-core",
    "crates/sc2-copilot-vision",
    "tools/schedule-data",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = "0.3"
reqwest = { version = "0.13", default-features = false, features = ["blocking"] }
eframe = { version = "0.35", default-features = false, features = ["accesskit", "default_fonts", "wgpu"] }
image = { version = "0.25", default-features = false }
imageproc = { version = "0.27", default-features = false }
half = "2.7"
windows = "0.62"

[workspace.dependencies.global-hotkey]
version = "0.8"

[workspace.dependencies.tray-icon]
version = "0.24"
