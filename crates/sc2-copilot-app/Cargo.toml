[package]
name = "sc2-copilot-app"
version.workspace = true
edition.workspace = true

[[bin]]
name = "sc2-copilot"
path = "src/main.rs"

[[bin]]
name = "sc2-fixture-replay"
path = "src/replay.rs"

[[bin]]
name = "sc2-monitor"
path = "src/monitor_main.rs"

[dependencies]
sc2-copilot-core = { path = "../sc2-copilot-core" }
tracing.workspace = true
tracing-subscriber.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
reqwest.workspace = true
eframe.workspace = true

[target.'cfg(windows)'.dependencies]
global-hotkey.workspace = true
tray-icon.workspace = true
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
sc2-copilot-core = { path = "../sc2-copilot-core" }
